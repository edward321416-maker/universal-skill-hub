name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned by commit SHA (verified via
      # `gh api repos/actions/checkout/tags` on 2026-09-05). v7's action.yml
      # declares `runs.using: node24` (checked directly, not assumed) — v4
      # declared node20 and triggered GitHub's Node 20 deprecation warning
      # on every step; v7 does not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/setup-node v7.0.0, pinned by commit SHA (verified via
      # `gh api repos/actions/setup-node/tags` on 2026-09-05). v7's
      # action.yml also declares `runs.using: node24` (checked directly).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # Active LTS as of 2026-09-05 (EOL 2028-04-30)

      - name: Install dependencies
        run: npm ci

      # npm run verify is the single source of truth for the release gate —
      # this workflow does not maintain a second, divergent copy of the
      # same check sequence. See package.json's "verify" script for exactly
      # what it runs: unit tests, validate, registry-consistency,
      # render-adapters + `git diff --exit-code` (fails if rendering
      # produced an uncommitted diff — i.e. a stale generated adapter),
      # check-drift, both bundle generators, and an installer dry-run smoke
      # test (never writes; only reports).
      - name: Verify
        run: npm run verify
