name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0, pinned by commit SHA (verified via
      # `gh api repos/actions/checkout/tags` on 2026-09-05)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # actions/setup-node v4.4.0, pinned by commit SHA (verified via
      # `gh api repos/actions/setup-node/tags` on 2026-09-05)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24' # Active LTS as of 2026-09-05 (EOL 2028-04-30)

      - name: Install dependencies
        run: npm ci

      # npm run verify is the single source of truth for the release gate —
      # this workflow does not maintain a second, divergent copy of the
      # same check sequence. See package.json's "verify" script for exactly
      # what it runs: unit tests, validate, registry-consistency,
      # render-adapters + `git diff --exit-code` (fails if rendering
      # produced an uncommitted diff — i.e. a stale generated adapter),
      # check-drift, both bundle generators, and an installer dry-run smoke
      # test (never writes; only reports).
      - name: Verify
        run: npm run verify
